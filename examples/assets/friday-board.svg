<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
  <title id="title">Fictional office whiteboard for the Friday huddle</title>
  <desc id="desc">Printer jammed twice. Toner shelf unlabeled. Returns sheet missing. Cafe tasting declined. No owners or deadlines are written on this board.</desc>
  <rect x="2" y="2" width="896" height="436" rx="14" fill="#faf9f6" stroke="#58584f" stroke-width="3"/>
  <g fill="#22221f" font-family="Arial, Helvetica, sans-serif">
    <text x="42" y="68" font-size="32" font-weight="700">OFFICE NOTES · FICTION</text>
    <text x="42" y="140" font-size="30">Printer jammed twice</text>
    <text x="42" y="205" font-size="30">Toner shelf unlabeled</text>
    <text x="42" y="270" font-size="30">Returns sheet missing</text>
    <text x="42" y="335" font-size="30">Cafe tasting declined</text>
    <text x="42" y="398" font-size="22">No owners or deadlines are written on this board.</text>
  </g>
</svg>
